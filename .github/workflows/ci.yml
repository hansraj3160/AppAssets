name: CI / CD Pipeline

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # 1. Quality Job: Biome Linting & TypeScript Typechecking
  quality:
    name: Code Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        id: setup-bun
        with:
          bun-version: latest

      - name: Fallback Setup Bun (npm)
        if: steps.setup-bun.outcome != 'success'
        run: |
          npm install -g bun
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun --version

      - name: Install Root Dependencies
        run: bun install

      - name: Install Studio Dependencies
        run: cd studio && bun install

      - name: Run Biome Linter
        run: bun run lint

      - name: Run TypeScript Typecheck (CLI & Studio)
        run: bun run typecheck

  # 2. Test Job: Unit & End-to-End Test Suite
  test:
    name: Test Suite (100 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Canvas System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        id: setup-bun
        with:
          bun-version: latest

      - name: Fallback Setup Bun (npm)
        if: steps.setup-bun.outcome != 'success'
        run: |
          npm install -g bun
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun --version

      - name: Install Root Dependencies
        run: bun install

      - name: Install Studio Dependencies
        run: cd studio && bun install

      - name: Run All Tests (Unit + E2E Dogfooding)
        run: bun test

  # 3. Build Job: Studio Frontend & CLI Distribution
  build:
    name: Build Artifacts (Studio & CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Canvas System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        id: setup-bun
        with:
          bun-version: latest

      - name: Fallback Setup Bun (npm)
        if: steps.setup-bun.outcome != 'success'
        run: |
          npm install -g bun
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun --version

      - name: Install Root Dependencies
        run: bun install

      - name: Install Studio Dependencies
        run: cd studio && bun install

      - name: Build Studio Web App
        run: bun run build:studio

      - name: Build CLI & Core Library
        run: bun run build:cli

      - name: Upload Studio Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: studio/dist/
          retention-days: 7

      - name: Upload CLI Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: dist/
          retention-days: 7

  # 4. Docker Job: Container Build & Healthcheck Verification
  docker:
    name: Docker Container & Healthcheck Probe
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t appassets-studio:ci .

      - name: Test Container Liveness Probe
        run: |
          docker run -d --name appassets-test -p 4321:4321 appassets-studio:ci
          # Wait up to 30 seconds for the service to start
          for i in {1..15}; do
            if curl -s http://localhost:4321/api/health | grep -q '"status":"ok"'; then
              echo "Container health check passed!"
              exit 0
            fi
            echo "Waiting for container to become healthy... ($i/15)"
            sleep 2
          done
          echo "Health check probe timed out!"
          docker logs appassets-test
          exit 1

      - name: Teardown Test Container
        if: always()
        run: |
          docker stop appassets-test || true
          docker rm appassets-test || true

  # 5. Deploy Job: Automatic Continuous Deployment to AWS EC2
  deploy:
    name: Deploy to AWS EC2 Production
    needs: [quality, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via Rsync & SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '52.66.73.8' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️ Notice: EC2_SSH_KEY secret is not set in GitHub repository secrets."
            echo "Skipping EC2 deployment. Add EC2_SSH_KEY in repository settings to enable auto-deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "🚀 Syncing codebase to EC2 ($EC2_HOST)..."
          rsync -avz \
            --exclude 'workspaces' \
            --exclude 'out' \
            --exclude 'node_modules' \
            --exclude 'studio/node_modules' \
            --exclude '.git' \
            --exclude '*.pem' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./ "${EC2_USER}@${EC2_HOST}:/home/ubuntu/appassets/"

          echo "🔧 Running remote deploy script on EC2..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${EC2_USER}@${EC2_HOST}" "bash /home/ubuntu/appassets/scripts/deploy.sh"

          echo "🎉 Deployment to https://appassetstudio.com completed successfully!"

